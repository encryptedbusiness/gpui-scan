[package]
name = "gpui-scan"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "React Scan for GPUI: re-render outlines, a live FPS readout, and a devtools inspector for any GPUI application"
documentation = "https://docs.rs/gpui-scan"
repository = "https://github.com/encryptedbusiness/gpui-scan"
readme = "README.md"
license = "MIT"
keywords = ["gpui", "devtools", "profiler", "rerender", "scan"]
categories = ["development-tools::debugging", "gui"]
include = ["/src", "/assets", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
gpui = { package = "gpui-pre", version = "0.3.12", features = ["inspector"] }
gpui-devtools = "0.6"
gpui-scan-macros = { version = "0.1.0", path = "gpui-scan-macros" }
rustc-hash = "2"
web-time = "1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.12", features = ["inspector", "test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.12", features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
] }

[lints]
workspace = true

[workspace]
members = ["examples/basic", "examples/web", "gpui-scan-macros"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
