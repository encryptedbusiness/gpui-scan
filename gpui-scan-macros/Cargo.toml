[package]
name = "gpui-scan-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Attribute macros for gpui-scan"
license = "MIT"
repository = "https://github.com/encryptedbusiness/gpui-scan"
documentation = "https://docs.rs/gpui-scan-macros"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true
