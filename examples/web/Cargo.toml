[package]
name = "gpui-scan-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui = { package = "gpui-pre", version = "0.3.12", features = ["inspector"] }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.12", default-features = false }
gpui-kit = { version = "0.9.1", default-features = false }
gpui-scan = { path = "../.." }
gpui-scan-basic = { path = "../basic" }
wasm-bindgen = "0.2"

[lints]
workspace = true
